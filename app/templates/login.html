{% extends "base.html" %}

{% block title %}
Login - QuizMaster
{% endblock %}

{% block content %}

<div class="auth-wrapper">

    <div class="auth-card">

        <div class="auth-icon">
            Q
        </div>

        <h1>Welcome Back</h1>

        <p class="auth-subtitle">
            Login to continue your quiz journey.
        </p>

        <form method="POST">

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button type="submit" class="auth-btn">
                Login
            </button>

        </form>


        <div class="auth-footer">

            <p>
                Don't have an account?
                <a href="{{ url_for('auth.register') }}">
                    Create Account
                </a>
            </p>

        </div>

    </div>

</div>

{% endblock %}
